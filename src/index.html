  <script>
    (function () {
      // Keep FA webfonts + gtag off the LCP critical path (hero image bandwidth).
      function loadStylesheet(href) {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = href;
        document.head.appendChild(l);
      }

      function bootFontAwesome() {
        if (window.faCssLoaded) return;
        window.faCssLoaded = true;
        loadStylesheet('/css/all.min.css');
      }

      function bootAnalytics() {
        if (window.gtagLoaded) return;
        window.gtagLoaded = true;
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-ZLPJM9Z3P4';
        s.async = true;
        s.onload = function () {
          gtag('js', new Date());
          gtag('config', 'G-ZLPJM9Z3P4');
        };
        document.head.appendChild(s);
      }

      function afterLoad(fn, delayMs) {
        var run = function () { setTimeout(fn, delayMs); };
        if (document.readyState === 'complete') run();
        else window.addEventListener('load', run);
      }

      // Icons: idle after load (icons are non-LCP).
      afterLoad(function () {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(bootFontAwesome, { timeout: 2500 });
        } else {
          bootFontAwesome();
        }
      }, 500);

      // Analytics: interaction or long idle — past typical lab LCP window.
      afterLoad(function () {
        var done = false;
        var kick = function () {
          if (done) return;
          done = true;
          bootAnalytics();
        };
        ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (type) {
          window.addEventListener(type, kick, { once: true, passive: true });
        });
        if ('requestIdleCallback' in window) {
          requestIdleCallback(kick, { timeout: 10000 });
        } else {
          setTimeout(kick, 6000);
        }
      }, 3000);
    })();
  </script>
