<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 720px; overflow: hidden; background: #023a2c; }
    .hero {
      width: 1920px;
      height: 720px;
      display: grid;
      grid-template-columns: 1.2fr 0.9fr 0.9fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      padding: 8px;
      background: #023a2c;
    }
    .cell {
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      background: #0a4a3a;
    }
    .cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .a { grid-column: 1; grid-row: 1 / span 2; } /* panoramic ruins view */
    .b { grid-column: 2; grid-row: 1; } /* gardens path to rock */
    .c { grid-column: 3; grid-row: 1; } /* rock + foreground stones */
    .d { grid-column: 2; grid-row: 2; } /* lion paws */
    .e { grid-column: 3; grid-row: 2; } /* framed rock view */
    .shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(2, 58, 44, 0.4) 0%, rgba(2, 58, 44, 0.08) 42%, transparent 68%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="cell a"><img src="FILE_A" alt="" /><div class="shade"></div></div>
    <div class="cell b"><img src="FILE_B" alt="" /><div class="shade"></div></div>
    <div class="cell c"><img src="FILE_C" alt="" /><div class="shade"></div></div>
    <div class="cell d"><img src="FILE_D" alt="" /><div class="shade"></div></div>
    <div class="cell e"><img src="FILE_E" alt="" /><div class="shade"></div></div>
  </div>
</body>
</html>
