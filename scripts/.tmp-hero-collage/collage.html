<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 720px; overflow: hidden; background: #0b1c18; }
    .hero {
      width: 1920px;
      height: 720px;
      display: grid;
      grid-template-columns: 1.15fr 0.95fr 0.95fr 0.95fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      padding: 8px;
      background: #021a14;
    }
    .cell {
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      background: #123;
    }
    .cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      image-rendering: auto;
    }
    .a { grid-column: 1; grid-row: 1 / span 2; }
    .b { grid-column: 2; grid-row: 1; }
    .c { grid-column: 3; grid-row: 1; }
    .d { grid-column: 4; grid-row: 1; }
    .e { grid-column: 2; grid-row: 2; }
    .f { grid-column: 3; grid-row: 2; }
    .g { grid-column: 4; grid-row: 2; }
    .shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(2, 26, 20, 0.45) 0%, rgba(2, 26, 20, 0.1) 40%, transparent 65%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="cell a"><img src="file:///D:/Website/jojotravels/ceylonjojotravels/scripts/.tmp-hero-collage/src/bullock.png" alt="" /><div class="shade"></div></div>
    <div class="cell b"><img src="file:///D:/Website/jojotravels/ceylonjojotravels/scripts/.tmp-hero-collage/src/leopard.png" alt="" /><div class="shade"></div></div>
    <div class="cell c"><img src="file:///D:/Website/jojotravels/ceylonjojotravels/scripts/.tmp-hero-collage/src/family.png" alt="" /><div class="shade"></div></div>
    <div class="cell d"><img src="file:///D:/Website/jojotravels/ceylonjojotravels/scripts/.tmp-hero-collage/src/elephants.png" alt="" /><div class="shade"></div></div>
    <div class="cell e"><img src="file:///D:/Website/jojotravels/ceylonjojotravels/scripts/.tmp-hero-collage/src/turtle.png" alt="" /><div class="shade"></div></div>
    <div class="cell f"><img src="file:///D:/Website/jojotravels/ceylonjojotravels/scripts/.tmp-hero-collage/src/sigiriya.png" alt="" /><div class="shade"></div></div>
    <div class="cell g"><img src="file:///D:/Website/jojotravels/ceylonjojotravels/scripts/.tmp-hero-collage/src/tower.png" alt="" /><div class="shade"></div></div>
  </div>
</body>
</html>
